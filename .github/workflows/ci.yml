name: experiment-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Validate the active experiment manifest
        run: python -m tripathy_experiment.cli validate
      - name: Verify the pinned public benchmark with both local oracles
        run: python -m tripathy_experiment.cli verify benchmarks/no_isosceles_n32.json
